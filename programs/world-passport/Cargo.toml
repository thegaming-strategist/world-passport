[package]
name = "world-passport"
version = "0.1.0"
description = "World Passport program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "world_passport"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }